<!DOCTYPE html>
<html lang="uz" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optika.uz - Eksklyuziv Ko'zoynaklar Katalogi</title>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #151c2c;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-gold: #f59e0b;
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-gold: #d97706;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background-color: var(--accent);
            color: #ffffff;
        }

        .cart-badge {
            background-color: #ef4444;
            color: white;
            border-radius: 9999px;
            padding: 0.2rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 700;
            margin-left: 5px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .control-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .control-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        main {
            max-width: 1300px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
        }

        .page-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .page-subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.15rem;
        }

        /* Filtering and Search Panel */
        .filter-panel {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .filter-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background-color: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: var(--accent-gold);
            color: #000;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .product-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background-color: #ffffff;
        }

        .product-info {
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .product-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }

        .product-rating {
            color: var(--accent-gold);
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .product-price {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin-bottom: 1.2rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
            padding: 0.85rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            text-align: center;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        footer {
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 2rem;
            margin-top: auto;
            color: var(--text-secondary);
        }
    </style>
</head>

                catalogSub: "Collection of top premium eyewear and accessories",

                contact: "Contact & Order",

                catSun: "Sunglasses",

                catPrem: "Premium"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'uz';
        let currentTheme = localStorage.getItem('theme') || 'dark';
        let currentCategory = 'all';
        let cart = JSON.parse(localStorage.getItem('cart_items')) || [];

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            document.getElementById('theme-btn').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            updateTexts();
            renderProducts();
        }

        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang] && translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key];
                }
            });
            document.getElementById('cart-badge-count').textContent = cart.length;
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            cart.push(p);
            localStorage.setItem('cart_items', JSON.stringify(cart));
            updateTexts();
            alert(p.name[currentLang] + " " + (currentLang === 'uz' ? "savatga qo'shildi!" : currentLang === 'ru' ? "добавлен в корзину!" : "added to cart!"));
        }

        function renderProducts() {
            const grid = document.getElementById('product-container');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            const filtered = products.filter(p => {
                const matchesCat = (currentCategory === 'all' || p.category === currentCategory);
                const matchesSearch = p.name[currentLang].toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding: 3rem; color: var(--text-secondary);">Mahsulot topilmadi.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          <div class="product-badge">${p.badge}</div>
          <img src="${p.img}" alt="${p.name[currentLang]}" class="product-img">
          <div class="product-info">
            <div class="product-title">${p.name[currentLang]}</div>
            <div class="product-desc">${p.desc[currentLang]}</div>
            <div class="product-rating">${p.rating}</div>
            <div class="product-price">${p.price}</div>
            <button class="btn-primary" onclick="addToCart(${p.id})">${translations[currentLang].addCart}</button>
          </div>
        </div>
      `).join('');
        }

        function filterProducts() {
            renderProducts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('theme-btn').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
            updateTexts();
            renderProducts();
        });
    </script>
</body>
